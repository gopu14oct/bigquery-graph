[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docparse"
version = "0.1.0"
description = "From-scratch document partitioning and chunking (Unstructured.io-style) with BigQuery staging"
readme = "docparse/README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]
pandas = ["pandas"]
bigquery = ["google-cloud-bigquery>=3"]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "pypdfium2>=4", "pdfplumber>=0.10", "rapidfuzz>=3", "pillow>=10"]
test = ["pytest", "httpx", "fastapi", "python-multipart", "pypdfium2", "pdfplumber", "reportlab", "python-docx", "python-pptx", "openpyxl"]

[project.scripts]
docparse = "docparse.cli:main"

[tool.setuptools.packages.find]
include = ["docparse*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
