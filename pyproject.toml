[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docparse"
version = "0.1.0"
description = "From-scratch document partitioning and chunking (Unstructured.io-style) with BigQuery staging"
readme = "docparse/README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]
pandas = ["pandas"]
bigquery = ["google-cloud-bigquery>=3"]
test = ["pytest", "pdfplumber", "reportlab", "python-docx", "python-pptx", "openpyxl"]

[project.scripts]
docparse = "docparse.cli:main"

[tool.setuptools.packages.find]
include = ["docparse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
